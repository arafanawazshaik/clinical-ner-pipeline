name: Clinical NER Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Check formatting (Black)
        run: black --check --line-length 100 src/ api/ scripts/ tests/

      - name: Check imports (isort)
        run: isort --check-only --profile black src/ api/ scripts/ tests/

      - name: Lint (flake8)
        run: flake8 src/ api/ scripts/ tests/ --max-line-length 100 --ignore E501,W503,E203

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers seqeval pydantic fastapi uvicorn pytest prometheus-client

      - name: Generate synthetic data
        run: python scripts/generate_synthetic_data.py

      - name: Train model (2 epochs)
        run: python scripts/train.py --epochs 2 --batch-size 4

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run evaluation
        run: python scripts/evaluate.py --split test --output reports/eval_report.json

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: reports/eval_report.json

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Dependency vulnerability scan (Safety)
        run: safety check --file requirements.txt || true

      - name: Code security scan (Bandit)
        run: bandit -r src/ api/ -ll --skip B101